name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - name: Restore
        run: dotnet restore
      - name: Formato
        run: dotnet format --verify-no-changes --no-restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Tests unitarios y de arquitectura
        run: >
          dotnet test --no-build --configuration Release
          --filter "FullyQualifiedName~UnitTests|FullyQualifiedName~ArchitectureTests"
      - name: Tests de integración (Testcontainers)
        run: >
          dotnet test --no-build --configuration Release
          --filter "FullyQualifiedName~IntegrationTests"

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium
      - name: Tests E2E
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
