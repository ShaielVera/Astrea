# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

# Generado por Azure (Centro de implementación) y ajustado para Astrea: la API está en backend/src/Astrea.Api.
# Se publica cuando cambia el backend (o a mano desde la pestaña Actions); los cambios de la página van a Vercel.
name: Publicar API en Azure (Astrea)

on:
  push:
    branches:
      - 'main'
    paths:
      - 'backend/**'
      - '.github/workflows/main_astrea.yml'
  workflow_dispatch:

concurrency:
  group: publicar-api-azure
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Compilar y empaquetar la API
        working-directory: backend
        run: dotnet publish src/Astrea.Api/Astrea.Api.csproj --configuration Release --output ${{ env.DOTNET_ROOT }}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.DOTNET_ROOT }}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A17A1D6EC21044E2B751B59BE6828683 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E76BFC64C6DD4E07BD1E92EBFE397D0E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A61EBA3526B241A184E7B97D298B5CB6 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Astrea'
          slot-name: 'Production'
          package: .
