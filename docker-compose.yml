# Base de datos local de desarrollo (PostgreSQL + pgvector).
# Credenciales solo para desarrollo local: nunca usar en otros ambientes.
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: astrea-db
    environment:
      POSTGRES_DB: astrea
      POSTGRES_USER: astrea
      POSTGRES_PASSWORD: astrea_dev
    ports:
      - "5433:5432"
    volumes:
      - astrea-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrea -d astrea"]
      interval: 10s
      timeout: 15s
      retries: 10

  # Firebase Auth Emulator: cuentas de prueba locales, sin tocar el proyecto real.
  # Interfaz web para ver los usuarios: http://localhost:4000
  firebase-emulator:
    build: ./infra/firebase-emulator
    container_name: astrea-firebase-emulator
    ports:
      - "9099:9099"
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:9099/').then(()=>process.exit(0)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

volumes:
  astrea-db-data:
